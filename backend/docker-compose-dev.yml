version: '3'

services:
  api:
    container_name: motorizando-api
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ..env
    ports:
      - "8000:8000"
      - "8001:8001" #debugpy
    depends_on:
      users-db:
        condition: service_healthy
    volumes:
      - .:/opt/web


volumes: 
  users_data:
