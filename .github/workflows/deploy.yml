name: Despliegue Completo App e Infra
on:
  push:
    branches: [ "feature/infra-terraform" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      # --- PASO NUEVO PARA SOLUCIONAR EL ERROR EACCES ---
      - name: Limpiar permisos de pgdata
        run: |
          if [ -d "infra_terraform/pgdata" ]; then
            sudo chown -R $USER:$USER infra_terraform/pgdata
          fi

      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          clean: false # Esto evita que el checkout intente borrar lo que no puede

      - name: 1. Desplegar Infraestructura con Terraform
        run: |
          cd infra_terraform
          terraform init
          terraform apply -auto-approve

      - name: 2. Desplegar Stack de Aplicación (Docker Compose)
        run: |
          cd ${{ github.workspace }}
          # LIMPIEZA PREVENTIVA: Removemos cualquier contenedor que use nuestros nombres
          docker rm -f node-exporter postgres grafana prometheus cadvisor backend frontend nginx || true
          
          # Levantamos con --force-recreate para asegurar limpieza total
          docker compose up -d --build --force-recreate 
      - name: 3. Verificar estado de los contenedores
        run: |
          echo "Estado actual de los servicios:"
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
