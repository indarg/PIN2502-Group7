name: Despliegue Final Terraform
on:
  push:
    branches: [ "feature/infra-terraform" ]

jobs:
  terraform-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Instalar Terraform en el Runner
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Terraform Init y Apply
        run: |
          cd infra_terraform
          terraform init
          terraform apply -auto-approve
